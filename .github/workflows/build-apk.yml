name: Build release

# Builda os artefatos de release na nuvem, em runners limpos — sem depender da
# máquina local nem de antivírus. Disparo manual (Actions → Run workflow) ou
# automático ao criar uma tag "v*".
#
#   build-apk     — APK Android (Ubuntu). Cria o release com as notas do CHANGELOG.
#   build-windows — .zip do Windows x64. Anexa ao release que o build-apk criou.
#
# Cada um também publica seu artefato de download avulso, mesmo sem tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release para anexar o APK (ex.: v1.1.0). Vazio = só artefato.'
        required: false
        default: 'v1.1.0'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version
      - run: flutter pub get

      # A chave de assinatura vem de um secret em base64 e só existe no disco
      # efêmero do runner. Sem ela o build falha de propósito: um APK assinado
      # com chave de debug muda de identidade a cada build, e atualizar por cima
      # passa a ser impossível — obrigando a desinstalar e apagando o cofre.
      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 ausente. Passo a passo em docs/RELEASE.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/keyring-release.jks"
          echo "KEYRING_KEYSTORE_PATH=${RUNNER_TEMP}/keyring-release.jks" >> "$GITHUB_ENV"

      - name: Build do APK
        env:
          KEYRING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYRING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYRING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      # Informativo: o digest deve ser o MESMO em todos os releases. Se mudar, a
      # chave mudou e as atualizações por cima vão falhar. Não derruba o build.
      - name: Conferir a assinatura do APK
        continue-on-error: true
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner não encontrado — assinatura não conferida."
            exit 0
          fi
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk \
            | grep -i 'certificate sha-256 digest'

      - name: Renomear APK com a versão
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          cp build/app/outputs/flutter-apk/app-release.apk "keyring-${VER}.apk"
          echo "APK=keyring-${VER}.apk" >> "$GITHUB_ENV"

      - name: Publicar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: keyring-apk
          path: ${{ env.APK }}

      - name: Publicar release com as notas do CHANGELOG (quando houver tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "Sem tag informada — APK disponível apenas como artefato."
            exit 0
          fi

          # Extrai do CHANGELOG a seção da versão da tag (## [X.Y.Z] ... até o próximo ## [).
          # Casamento literal com index() — regex com \[ vira character-class no gawk.
          VERSION="${TAG#v}"
          awk -v hdr="## [${VERSION}]" '
            index($0, hdr) == 1 {p=1; print; next}
            p && index($0, "## [") == 1 {exit}
            p {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Sem seção no CHANGELOG para ${VERSION} — usando notas geradas pelo GitHub." >&2
          fi

          # Cria o release se ainda não existir; senão, só reanexa o APK.
          if gh release view "$TAG" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${APK}" --clobber -R "${GITHUB_REPOSITORY}"
            echo "APK reanexado ao release ${TAG}."
          elif [ -s release-notes.md ]; then
            gh release create "$TAG" "${APK}" -R "${GITHUB_REPOSITORY}" \
              --title "Keyring ${VERSION}" --notes-file release-notes.md
            echo "Release ${TAG} criado com as notas do CHANGELOG."
          else
            gh release create "$TAG" "${APK}" -R "${GITHUB_REPOSITORY}" \
              --title "Keyring ${VERSION}" --generate-notes
            echo "Release ${TAG} criado com notas geradas automaticamente."
          fi

  build-windows:
    # Depois do build-apk, que é quem cria o release. Assim o Windows só anexa,
    # e não há dois jobs disputando a criação do mesmo release.
    needs: build-apk
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version
      - run: flutter pub get

      # O runner windows-latest já traz o Visual Studio 2022 com o componente ATL,
      # exigido pelo flutter_secure_storage_windows. A macro de coroutine em
      # windows/CMakeLists.txt cobre o MSVC novo, então o build é limpo aqui.
      - name: Build do Windows
        run: flutter build windows --release

      - name: Empacotar o .zip
        shell: bash
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          ZIP="keyring-${VER}-windows-x64.zip"
          powershell -Command "Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath '${ZIP}' -Force"
          echo "ZIP=${ZIP}" >> "$GITHUB_ENV"

      - name: Publicar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: keyring-windows
          path: ${{ env.ZIP }}

      - name: Anexar ao release (quando houver tag)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "Sem tag informada — zip disponível apenas como artefato."
            exit 0
          fi
          gh release upload "$TAG" "${ZIP}" --clobber -R "${GITHUB_REPOSITORY}"
          echo "Zip do Windows anexado ao release ${TAG}."
